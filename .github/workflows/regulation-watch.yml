name: Regulation watch
# Fails (and notifies the repo owner) when armypubs.army.mil lists a newer
# AR 670-1 / DA PAM 670-1 / AR 600-8-22 than the rule data was written against.
on:
  schedule:
    - cron: '17 13 * * 1' # Mondays
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-pubs.mjs
